name: Docker build and push

# Images for branches/PRs. Version tags (v*) are published by the Release / GoReleaser job
# so we don't double multi-arch build on every tag.
on:
  push:
    branches:
      - "master"
      - "release/*"
  pull_request:
    branches:
      - "master"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: donkeyx/tcp-wait
  GHCR_IMAGE: ghcr.io/donkeyx/tcp-wait

jobs:
  docker:
    runs-on: ubuntu-latest
    # Same place as release secrets today; also works with repo-level vars/secrets.
    environment: deployment
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # PRs: native amd64 only (fast). Push/tag: multi-arch for publish.
      - name: Set build platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Prefer cluster-utils-api names (USERNAME var + TOKEN secret); fall back to
      # DOCKERHUB_USER / DOCKERHUB_PASS so existing deployment secrets still work.
      - name: Login to Docker Hub
        if: >-
          github.event_name != 'pull_request' &&
          (vars.DOCKERHUB_USERNAME != '' || secrets.DOCKERHUB_USER != '')
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASS }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Update Docker Hub README
        if: >-
          github.event_name != 'pull_request' &&
          (vars.DOCKERHUB_USERNAME != '' || secrets.DOCKERHUB_USER != '')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASS }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./README.md
